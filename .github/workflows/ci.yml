name: Fabric compatibility

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: legacy
            java: '21'
          - project: modern
            java: '25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: gradle :${{ matrix.project }}:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pisan-${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/*-mc*.jar
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.1'
            family: legacy
            java: '21'
          - mc: '1.21.2'
            family: legacy
            java: '21'
          - mc: '1.21.3'
            family: legacy
            java: '21'
          - mc: '1.21.4'
            family: legacy
            java: '21'
          - mc: '1.21.5'
            family: legacy
            java: '21'
          - mc: '1.21.6'
            family: legacy
            java: '21'
          - mc: '1.21.7'
            family: legacy
            java: '21'
          - mc: '1.21.8'
            family: legacy
            java: '21'
          - mc: '1.21.9'
            family: legacy
            java: '21'
          - mc: '1.21.10'
            family: legacy
            java: '21'
          - mc: '1.21.11'
            family: legacy
            java: '21'
          - mc: '26.1'
            family: modern
            java: '25'
          - mc: '26.1.1'
            family: modern
            java: '25'
          - mc: '26.1.2'
            family: modern
            java: '25'
          - mc: '26.2'
            family: modern
            java: '25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: pisan-${{ matrix.family }}
          path: artifacts
      - run: |
          JAR="$(find artifacts -name '*-mc*.jar' ! -name '*-sources.jar' | head -1)"
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh '${{ matrix.mc }}' "$JAR"
